name: Rename demo to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f demo-web-hamburgueseria.html ]; then
            git mv demo-web-hamburgueseria.html index.html
            git commit -m "Rename demo file to index.html"
            git push
          else
            echo "demo-web-hamburgueseria.html not found"
            ls -la
            exit 1
          fi
